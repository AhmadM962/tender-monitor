# ============================================================================
# Jordan Tender Monitor - behaviour & keyword configuration
# ----------------------------------------------------------------------------
# TWO-TIER MATCHING (re-calibrated 2026-11-04 on 11,199 real JONEPS tenders
# + the live dry-run of 2026-11-04):
#   include    STRONG terms - unambiguous IT/security -> always starred
#   weak       generic terms (نظام, system, digital, شبكة...) -> starred only
#              when the title has NO weak_veto term
#   weak_veto  other-domain words (fire, HVAC, medical, roads, water...).
#              A veto NEVER cancels a strong hit.
#   skip_types tender types never starred (medicines)
#   exclude    hard veto on everything - keep EMPTY unless you are sure
# Results: core-IT recall 94.3% on Arabic list titles (same as before),
# works-tender noise 6.8% -> 1.8%, total starred 15.8% -> 13%.
# On the live 2026-11-04 JONEPS batch: 24 starred -> 13, all 11 removed
# were non-IT (fire systems, HVAC, medical gas, CT scanner, roads...).
# GOTCHA learned: matching is substring-based, so a veto word must not hide
# inside an IT word (طبي is inside تطبيق!) - always re-run keyword_check.
# Keywords never hide a tender: unstarred new tenders are still emailed.
# Re-check after edits:  python keyword_check.py joneps_data\harvest.csv
# ============================================================================

