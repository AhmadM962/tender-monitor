name: Jordan Tender Monitor

on:
  schedule:
    # Jordan is UTC+3 all year. These = 08:00 and 14:30 Amman time.
    # (GitHub may start scheduled runs a few minutes late at busy times.)
    - cron: "0 5 * * *"
    - cron: "30 11 * * *"
  workflow_dispatch: {}   # "Run workflow" button in the Actions tab

permissions:
  contents: write   # to commit state/seen.json back, so only NEW tenders alert

concurrency:
  group: tender-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Self-test (offline, 38 checks) - stops here if the code is broken
        run: python -u selftest.py

      - name: Run monitor
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python -u monitor.py   # -u = stream the log live

      - name: Persist state (so we only alert on NEW tenders)
        run: |
          git config user.name "tender-monitor-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/seen.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: update tender state [skip ci]"
          # GitHub intermittently answers pushes with "Internal Server Error";
          # retry with backoff so the state isn't lost (lost state = the same
          # tenders get emailed again next run).
          for i in 1 2 3 4 5 6; do
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi
            echo "push failed (attempt $i), retrying in $((i*10))s..."; sleep $((i*10))
          done
          echo "::error::Could not save state after 6 attempts - next run may repeat some alerts"
          exit 1
