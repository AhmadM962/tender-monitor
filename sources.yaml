# ============================================================================
# Jordan Tender Monitor - source list
# ----------------------------------------------------------------------------
# parser: generic  -> works for the shared gov platform (/AR/Modules/Tenders),
#                     WordPress sites, universities, etc.
# parser: joneps   -> the JONEPS public tender invitation list
# enabled: false   -> no tender page found / entity not verified yet; flip to
#                     true once you confirm the URL in a browser.
# "status" is a human note only - the script ignores it.
# ============================================================================

sources:

  # ------------------------- CENTRAL PORTALS (high value) -------------------
  - id: joneps_v2   # v2 = identity is tender no + sequence (deadline/title amendments no longer re-alert); first run re-baselines silently
    name: "JONEPS - national e-procurement (GPD + GTD, covers JSC, MFA & others)"
    url: "https://www.joneps.gov.jo/ep/invt/selectListTendInvitAL.do?menuId=EP03000000&upperMenuId=EP03020000&subMenuId=EP03020100"
    parser: joneps
    enabled: true
    pages: 10   # FALLBACK ONLY: used when the bulk POST fails (monitor tries the POST first)
    status: upgraded 2026-11-02 - bulk POST (csrf + recordCountPerPage=2000, window today-35d..+95d) pulls the FULL active list (~750 tenders) in one request; see joneps_data/joneps_search_request.md

  - id: gtd
    name: "Government Tenders Directorate (works & technical services)"
    url: "https://www.gtd.gov.jo/AR/Modules/Tenders"
    parser: generic
    enabled: true
    status: central works tenders; also publishes on JONEPS

  - id: modee
    name: "Ministry of Digital Economy & Entrepreneurship (central gov IT tenders)"
    url: "https://modee.gov.jo/AR/modules/advancedtenders"
    parser: generic
    enabled: true
    status: verified - publishes cross-government ICT tenders (not in your accounts but posts tenders for them)

  - id: modee_simple
    name: "MoDEE - simple tenders view"
    url: "https://www.modee.gov.jo/AR/Modules/Tenders"
    parser: generic
    enabled: false
    status: disabled 2026-11-02 - live test showed identical 14 items as the advanced view -> would double-alert every MoDEE tender

